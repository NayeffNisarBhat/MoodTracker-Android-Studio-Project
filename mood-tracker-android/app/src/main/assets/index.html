<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mood Tracker</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1f2430; --muted: #6b7280;
    --line: #e4e2da; --accent: #4f6bed; --bar: #a5b4fc;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161c; --card: #1e212a; --text: #eceef3; --muted: #9aa1b2;
      --line: #2c303b; --accent: #7c93ff; --bar: #4a58b8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161c; --card: #1e212a; --text: #eceef3; --muted: #9aa1b2;
    --line: #2c303b; --accent: #7c93ff; --bar: #4a58b8;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 16px;
  }
  .moods { display: flex; gap: 8px; margin-bottom: 12px; }
  .moods button {
    flex: 1; font-size: 1.6rem; padding: 10px 0; cursor: pointer;
    background: var(--bg); border: 2px solid var(--line); border-radius: 12px;
  }
  .moods button.selected { border-color: var(--accent); }
  textarea {
    width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical;
    padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit;
  }
  .save {
    margin-top: 10px; width: 100%; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  .save:disabled { opacity: .45; cursor: not-allowed; }
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 110px; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar { width: 100%; background: var(--bar); border-radius: 6px 6px 0 0; min-height: 3px; }
  .bar.empty { background: var(--line); }
  .lbl { font-size: .72rem; color: var(--muted); margin-top: 4px; }
  .entry { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .entry:first-of-type { border-top: 0; }
  .entry .emoji { font-size: 1.5rem; }
  .entry .body { flex: 1; min-width: 0; }
  .entry .when { font-size: .8rem; color: var(--muted); }
  .entry .note { word-wrap: break-word; }
  .del { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1.1rem; }
  .empty-msg { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Mood Tracker</h1>
  <p class="sub">How are you feeling right now?</p>

  <section class="card">
    <div class="moods" id="moods"></div>
    <textarea id="note" placeholder="Add a note (optional)"></textarea>
    <button class="save" id="save" disabled>Save entry</button>
  </section>

  <section class="card">
    <h2>Last 7 days</h2>
    <div class="chart" id="chart"></div>
  </section>

  <section class="card">
    <h2>History</h2>
    <div id="history"></div>
  </section>
</main>

<script>
  // The five moods: value 1 (low) to 5 (high)
  const MOODS = [
    { value: 1, emoji: "😞", label: "Awful" },
    { value: 2, emoji: "😕", label: "Bad" },
    { value: 3, emoji: "😐", label: "Okay" },
    { value: 4, emoji: "🙂", label: "Good" },
    { value: 5, emoji: "😄", label: "Great" }
  ];
  const KEY = "mood-entries";
  let entries = load();
  let selected = null;

  // ---- Storage (wrapped in try/catch because it can fail) ----
  function load() {
    try {
      return JSON.parse(localStorage.getItem(KEY)) || [];
    } catch (e) {
      return [];
    }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(entries));
    } catch (e) {
      console.error("Could not save", e);
    }
  }

  // ---- Mood buttons ----
  const moodsEl = document.getElementById("moods");
  const saveBtn = document.getElementById("save");
  const noteEl = document.getElementById("note");

  MOODS.forEach(function (m) {
    const b = document.createElement("button");
    b.textContent = m.emoji;
    b.title = m.label;
    b.setAttribute("aria-label", m.label);
    b.addEventListener("click", function () {
      selected = m.value;
      document.querySelectorAll(".moods button").forEach(function (x) {
        x.classList.remove("selected");
      });
      b.classList.add("selected");
      saveBtn.disabled = false;
    });
    moodsEl.appendChild(b);
  });

  saveBtn.addEventListener("click", function () {
    if (selected === null) return;
    entries.unshift({
      id: Date.now(),
      time: new Date().toISOString(),
      mood: selected,
      note: noteEl.value.trim()
    });
    save();
    selected = null;
    noteEl.value = "";
    saveBtn.disabled = true;
    document.querySelectorAll(".moods button").forEach(function (x) {
      x.classList.remove("selected");
    });
    render();
  });

  // ---- Rendering ----
  function dayKey(d) {
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  function renderChart() {
    const chart = document.getElementById("chart");
    chart.innerHTML = "";
    for (let i = 6; i >= 0; i--) {
      const day = new Date();
      day.setDate(day.getDate() - i);
      const key = dayKey(day);
      const todays = entries.filter(function (e) {
        return dayKey(new Date(e.time)) === key;
      });
      const avg = todays.length
        ? todays.reduce(function (s, e) { return s + e.mood; }, 0) / todays.length
        : 0;

      const col = document.createElement("div");
      col.className = "col";
      const bar = document.createElement("div");
      bar.className = "bar" + (avg ? "" : " empty");
      bar.style.height = (avg ? (avg / 5) * 100 : 0) + "%";
      bar.title = avg ? "Average: " + avg.toFixed(1) : "No entries";
      const lbl = document.createElement("div");
      lbl.className = "lbl";
      lbl.textContent = day.toLocaleDateString(undefined, { weekday: "short" });
      col.appendChild(bar);
      col.appendChild(lbl);
      chart.appendChild(col);
    }
  }

  function renderHistory() {
    const box = document.getElementById("history");
    box.innerHTML = "";
    if (!entries.length) {
      const p = document.createElement("p");
      p.className = "empty-msg";
      p.textContent = "No entries yet. Pick a mood above to start.";
      box.appendChild(p);
      return;
    }
    entries.forEach(function (e) {
      const m = MOODS[e.mood - 1];
      const row = document.createElement("div");
      row.className = "entry";

      const emoji = document.createElement("div");
      emoji.className = "emoji";
      emoji.textContent = m.emoji;

      const body = document.createElement("div");
      body.className = "body";
      const when = document.createElement("div");
      when.className = "when";
      when.textContent = m.label + " · " + new Date(e.time).toLocaleString(undefined, {
        month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
      });
      body.appendChild(when);
      if (e.note) {
        const note = document.createElement("div");
        note.className = "note";
        note.textContent = e.note; // textContent keeps user text safe
        body.appendChild(note);
      }

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "✕";
      del.setAttribute("aria-label", "Delete entry");
      del.addEventListener("click", function () {
        entries = entries.filter(function (x) { return x.id !== e.id; });
        save();
        render();
      });

      row.appendChild(emoji);
      row.appendChild(body);
      row.appendChild(del);
      box.appendChild(row);
    });
  }

  function render() {
    renderChart();
    renderHistory();
  }
  render();
</script>
</body>
</html>
